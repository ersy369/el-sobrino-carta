<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Panel de pedidos — El Sobrino</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --crema:#FBEBD3;
    --choco:#2E1B12;
    --choco-2:#3D2416;
    --terracota:#D9903F;
    --rojo:#A52A2A;
    --verde:#3C7A4E;
    --texto-claro:#F6ECDD;
    --texto-oscuro:#2E1B12;
    --cafe:#6B4A32;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--choco);
    color:var(--texto-claro);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  header{
    background:var(--choco-2);
    padding:16px 18px;
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid rgba(217,144,63,0.25);
  }
  header .titulo{display:flex;flex-direction:column;line-height:1.15;}
  header .chico{
    font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--terracota);font-weight:700;
  }
  header .grande{font-family:Georgia,serif;font-size:20px;}
  #estadoConexion{
    font-size:11px;padding:5px 10px;border-radius:100px;
    background:rgba(60,122,78,0.18);color:#8fd9a4;border:1px solid rgba(60,122,78,0.4);
  }
  #estadoConexion.reconectando{background:rgba(165,42,42,0.18);color:#e79b9b;border-color:rgba(165,42,42,0.4);}

  main{max-width:640px;margin:0 auto;padding:16px;}
  .resumen-top{
    display:flex;gap:10px;margin-bottom:16px;
  }
  .stat{
    flex:1;background:var(--choco-2);border-radius:14px;padding:12px 14px;
    border:1px solid rgba(217,144,63,0.2);
  }
  .stat b{display:block;font-size:24px;font-family:Georgia,serif;color:var(--terracota);}
  .stat span{font-size:11.5px;color:rgba(246,236,221,0.75);}

  .vacio{
    text-align:center;padding:60px 20px;color:rgba(246,236,221,0.6);
    font-size:14.5px;
  }
  .pedido{
    background:var(--crema);color:var(--texto-oscuro);
    border-radius:16px;padding:16px;margin-bottom:14px;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    border-left:5px solid var(--terracota);
    animation:entra .35s ease;
  }
  .pedido.atendido{opacity:0.55;border-left-color:var(--verde);}
  @keyframes entra{from{transform:translateY(-8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .pedido-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .pedido-mesa{font-family:Georgia,serif;font-size:19px;}
  .pedido-hora{font-size:11.5px;color:var(--cafe);white-space:nowrap;}
  .pedido-items{margin-bottom:10px;}
  .pedido-linea{
    display:flex;justify-content:space-between;font-size:14px;
    padding:3px 0;border-bottom:1px dashed rgba(46,27,18,0.15);
  }
  .pedido-total{
    display:flex;justify-content:space-between;font-weight:700;font-size:15px;
    margin-bottom:12px;
  }
  .btn-atender{
    width:100%;padding:11px;border-radius:10px;border:none;cursor:pointer;
    background:var(--verde);color:#fff;font-weight:700;font-size:13.5px;
  }
  .btn-atender:active{transform:translateY(1px);}
  .badge-atendido{
    display:inline-block;font-size:11px;font-weight:700;color:var(--verde);
    background:rgba(60,122,78,0.12);padding:4px 10px;border-radius:100px;
  }

  .config-aviso{
    background:rgba(165,42,42,0.15);border:1px solid rgba(165,42,42,0.4);
    border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.5;margin-bottom:16px;
  }
  .toggle-historial{
    text-align:center;margin:18px 0 6px;font-size:12.5px;
    color:rgba(246,236,221,0.7);cursor:pointer;text-decoration:underline;
  }
</style>
</head>
<body>

<header>
  <div class="titulo">
    <span class="chico">El Sobrino</span>
    <span class="grande">Panel de pedidos</span>
  </div>
  <span id="estadoConexion">conectando…</span>
</header>

<main>
  <div id="avisoConfig"></div>

  <div class="resumen-top">
    <div class="stat"><b id="statPendientes">0</b><span>pedidos pendientes</span></div>
    <div class="stat"><b id="statHoy">0</b><span>pedidos hoy</span></div>
  </div>

  <div id="listaPendientes"></div>
  <div id="vacioPendientes" class="vacio">Todavía no llegan pedidos. Deja esta pantalla abierta — aparecerán solos aquí apenas alguien confirme su pedido en la carta.</div>

  <p class="toggle-historial" id="toggleHistorial">Ver pedidos ya atendidos hoy ▾</p>
  <div id="listaAtendidos" style="display:none;"></div>
</main>

    messagingSenderId: "1050112741711",
    appId: "1:1050112741711:web:4eb230456bac5f072ff53a"
  };

  var avisoConfig = document.getElementById('avisoConfig');
  var estadoConexion = document.getElementById('estadoConexion');

  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('PEGA_AQUI') !== -1){
    avisoConfig.innerHTML = '<div class="config-aviso">⚠️ Todavía falta pegar la configuración real de Firebase en este archivo (panel.html) y en index.html. Mientras tanto este panel no puede conectarse.</div>';
    estadoConexion.textContent = 'sin configurar';
  } else {
    iniciarPanel();
  }

  function iniciarPanel(){
    var app = initializeApp(firebaseConfig);
    var db = getFirestore(app);

    var inicioHoy = new Date();
    inicioHoy.setHours(0,0,0,0);
    var tsInicioHoy = Timestamp.fromDate(inicioHoy);

    var q = query(
      collection(db, "pedidos"),
      where("creado", ">=", tsInicioHoy),
      orderBy("creado", "desc")
    );

    var primeraCarga = true;
    var sonido = document.getElementById('sonidoAviso');

    onSnapshot(q, function(snapshot){
      estadoConexion.textContent = 'en vivo';
      estadoConexion.classList.remove('reconectando');

      var pendientes = [];
      var atendidos = [];

      snapshot.forEach(function(docSnap){
        var d = docSnap.data();
        d._id = docSnap.id;
        if (d.estado === 'atendido'){ atendidos.push(d); } else { pendientes.push(d); }
      });

      // Sonido de aviso cuando entra un pedido nuevo (no en la primera carga)
      if (!primeraCarga){
        snapshot.docChanges().forEach(function(change){
          if (change.type === 'added'){
            try { sonido.currentTime = 0; sonido.play().catch(function(){}); } catch(e){}
          }
        });
      }
      primeraCarga = false;

      document.getElementById('statPendientes').textContent = pendientes.length;
      document.getElementById('statHoy').textContent = pendientes.length + atendidos.length;

      renderLista(pendientes, document.getElementById('listaPendientes'), db, doc, updateDoc, false);
      renderLista(atendidos, document.getElementById('listaAtendidos'), db, doc, updateDoc, true);

      document.getElementById('vacioPendientes').style.display = pendientes.length === 0 ? 'block' : 'none';
    }, function(error){
      console.error(error);
      estadoConexion.textContent = 'reconectando…';
      estadoConexion.classList.add('reconectando');
    });
  }

  function renderLista(pedidos, contenedor, db, doc, updateDoc, sonAtendidos){
    contenedor.innerHTML = '';
    pedidos.forEach(function(p){
      var hora = '';
      try { hora = p.creado.toDate().toLocaleTimeString('es-PE', { hour:'2-digit', minute:'2-digit' }); } catch(e){}

      var card = document.createElement('div');
      card.className = 'pedido' + (sonAtendidos ? ' atendido' : '');

      var lineas = (p.items || []).map(function(it){
        return '<div class="pedido-linea"><span>' + it.cantidad + ' × ' + it.nombre + '</span><b>S/ ' + (it.cantidad * it.precio).toFixed(2).replace(/\.00$/,'') + '</b></div>';
      }).join('');

      card.innerHTML =
        '<div class="pedido-head">' +
          '<span class="pedido-mesa">' + (p.mesa || 'Sin mesa') + '</span>' +
          '<span class="pedido-hora">' + hora + '</span>' +
        '</div>' +
        '<div class="pedido-items">' + lineas + '</div>' +
        '<div class="pedido-total"><span>Total</span><span>S/ ' + (p.total || 0).toFixed(2).replace(/\.00$/,'') + '</span></div>' +
        (sonAtendidos
          ? '<span class="badge-atendido">✓ Atendido</span>'
          : '<button class="btn-atender">Marcar como atendido</button>');

      if (!sonAtendidos){
        card.querySelector('.btn-atender').addEventListener('click', function(){
          updateDoc(doc(db, 'pedidos', p._id), { estado: 'atendido' }).catch(function(err){
            console.error('No se pudo actualizar el pedido', err);
          });
        });
      }

      contenedor.appendChild(card);
    });
  }

  document.getElementById('toggleHistorial').addEventListener('click', function(){
    var lista = document.getElementById('listaAtendidos');
    var visible = lista.style.display !== 'none';
    lista.style.display = visible ? 'none' : 'block';
    this.textContent = visible ? 'Ver pedidos ya atendidos hoy ▾' : 'Ocultar pedidos atendidos ▴';
  });
</script>

</body>
</html>
